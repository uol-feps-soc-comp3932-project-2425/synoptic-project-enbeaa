<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotLight - Website Comparison Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/fontawesome/all.min.css">
  
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <span>SpotLight - Website Comparison Tool</span>
      </div>
    </div>

    <div class="banner">
      <h1>Spotlight</h1>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="tasks">My Tasks</button>
    </div>
    
    <div class="tab-content" id="overview-tab">
      <div class="section">
        <h2>Import Design Tokens</h2>
        <p>Upload your design tokens JSON file:</p>
        <div class="import-area">
          <input type="file" id="fileInput" accept=".json">
          <button id="importBtn"><i class="fas fa-arrow-up-from-bracket"></i></button>
        </div>
      </div>
    </div>
    
    <div class="tab-content" id="tasks-tab" style="display: none;">
      <div class="section-header">
      <div id="comparison-results">
        <div class="section">
          <p>No comparison data yet. Import design tokens and select an element to start comparing.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
